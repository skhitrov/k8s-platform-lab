name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install validation tools from checksum lock
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq ripgrep shellcheck
          bash scripts/install-ci-tools.sh
      - name: Unit, manifest, workflow, and security gates
        run: make verify
      - name: Prove validators reject negative fixtures
        run: make test-validators
      - name: PostgreSQL concurrency, leases, and interruption tests
        run: make test-integration
      - name: Kubernetes smoke and backup/restore
        run: make e2e
      - name: Scan the tested runtime image
        run: trivy image --scanners vuln --exit-code 1 --severity HIGH,CRITICAL taskflow:dev
      - name: Retain diagnostics and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-${{ github.sha }}
          path: |
            coverage.out
            .cache/rendered/
            .cache/reports/
          if-no-files-found: warn
          retention-days: 7

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "taskflow.serviceAccountName" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  labels:
    {{- include "taskflow.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}

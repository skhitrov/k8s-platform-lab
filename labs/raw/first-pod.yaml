apiVersion: v1
kind: Pod
metadata:
  name: taskflow-version
  namespace: taskflow-learning
  labels:
    app.kubernetes.io/name: taskflow-learning
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: version
      image: taskflow:dev
      imagePullPolicy: Never
      args: [version]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: taskflow-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: taskflow-lab-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: Taskflow local lab CA
  secretName: taskflow-lab-ca
  duration: 8760h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: taskflow-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: taskflow-lab-ca
spec:
  ca:
    secretName: taskflow-lab-ca

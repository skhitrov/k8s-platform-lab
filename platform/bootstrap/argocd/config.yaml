apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  timeout.reconciliation: 60s
  # Parent sync waves wait for actual child reconciliation and health.
  resource.customizations.health.argoproj.io_Application: |
    local hs = { status = "Progressing", message = "Waiting for child Application" }
    if obj.status ~= nil and obj.status.sync ~= nil and obj.status.health ~= nil then
      if obj.status.sync.status == "Synced" then
        hs.status = obj.status.health.status
        hs.message = obj.status.health.message or ""
      end
    end
    return hs

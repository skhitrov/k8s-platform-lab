controller:
  replicaCount: 1
  nodeSelector:
    ingress-ready: "true"
    kubernetes.io/os: linux
  hostPort:
    enabled: true
  service:
    type: ClusterIP
  admissionWebhooks:
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

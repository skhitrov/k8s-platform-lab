fullnameOverride: tempo
tempo:
  memBallastSizeMbs: 0
  reportingEnabled: false
  retention: 6h
  resources:
    requests: {cpu: 75m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}
  extraEnv:
    - name: GOMEMLIMIT
      value: 300MiB
  receivers:
    jaeger:
      protocols:
        thrift_compact: {endpoint: "127.0.0.1:6831"}
        thrift_binary: {endpoint: "127.0.0.1:6832"}
        thrift_http: {endpoint: "127.0.0.1:14268"}
        grpc: {endpoint: "127.0.0.1:14250"}
    opencensus: null
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
persistence:
  enabled: true
  size: 2Gi

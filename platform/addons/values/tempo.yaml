fullnameOverride: tempo
tempo:
  memBallastSizeMbs: 0
  reportingEnabled: false
  retention: 6h
  resources:
    requests: {cpu: 75m, memory: 256Mi}
    limits: {cpu: 500m, memory: 768Mi}
  extraEnv:
    - name: GOMEMLIMIT
      value: 500MiB
  # Startup alone missed an OOM at the first block completion. Keep the
  # monolithic instance's write buffers and query fan-out laptop-sized.
  ingester:
    concurrent_flushes: 1
    max_block_bytes: 8388608
    max_block_duration: 2m
  querier:
    max_concurrent_queries: 2
  queryFrontend:
    search:
      concurrent_jobs: 2
    metrics:
      concurrent_jobs: 2
  storage:
    trace:
      block:
        parquet_row_group_size_bytes: 4194304
      search:
        read_buffer_count: 2
        read_buffer_size_bytes: 1048576
      pool:
        max_workers: 4
        queue_depth: 100
  receivers:
    jaeger:
      protocols:
        thrift_compact: {endpoint: "127.0.0.1:6831"}
        thrift_binary: {endpoint: "127.0.0.1:6832"}
        thrift_http: {endpoint: "127.0.0.1:14268"}
        grpc: {endpoint: "127.0.0.1:14250"}
    opencensus: null
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
persistence:
  enabled: true
  size: 2Gi
